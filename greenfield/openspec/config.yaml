schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Projeto: greenfield, uma aplicação nova, ainda sem telas e sem funcionalidades.
  Antes de cada artefato, leia VISION.md (princípios), ARCHITECTURE.md (stack e regras)
  e DESIGN.md (sistema visual).
  Toda mudança nasce de um PRD em docs/prd/; a proposta cita o arquivo do PRD.
  Stack: TypeScript strict, Node.js 26, React com Vite, PostgreSQL 18 com Drizzle ORM,
  ESLint, Vitest e Docker.

rules:
  proposal:
    - Citar o PRD de origem (docs/prd/NNN-nome.md) e o item do "Pronto quando" que a mudança cobre.
  tasks:
    - Cada tarefa de código começa por um teste que falha, e a tarefa diz o comando que mostra a falha.
    - Não crie tarefa que só se verifica no navegador; a verificação visual fica para o time.

operations:
  apply:
    guidance:
      - Para cada tarefa, rode o teste novo e mostre a falha antes de escrever o código.
      - Faça um commit ao fim de cada tarefa.
  archive:
    guidance:
      - Sincronize as specs antes de arquivar.
