# Copie para azure-pipelines.yml na raiz. Depois, ligue este pipeline como validação de build na política da branch principal.
trigger: none
pool:
  vmImage: ubuntu-latest
steps:
  - task: NodeTool@0
    inputs:
      versionSpec: 24.x
  - script: npm ci
    displayName: Instalar
  - script: npm run verificar
    displayName: Lint, tipos e testes
