# Copie para azure-pipelines.yml na raiz. Depois, ligue este pipeline como validação de build na política da branch principal.
trigger: none
pool:
  vmImage: ubuntu-latest
steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      useGlobalJson: true
  - script: dotnet run scripts/verificar.cs
    displayName: Formatação, build e testes
