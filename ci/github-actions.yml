# Copie para .github/workflows/ci.yml. Depois, exija este job na regra de proteção da branch principal.
name: ci
on:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run scripts/verificar.cs
